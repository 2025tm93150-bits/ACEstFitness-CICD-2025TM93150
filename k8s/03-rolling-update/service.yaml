apiVersion: v1
kind: Service
metadata:
  name: aceest-service
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
spec:
  type: NodePort
  selector:
    app: aceest-fitness
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-service
            port:
              number: 5000
