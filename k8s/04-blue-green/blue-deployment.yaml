apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      color: blue
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        color: blue
        version: "2.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:2.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
        - name: DEPLOYMENT_COLOR
          value: "blue"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
