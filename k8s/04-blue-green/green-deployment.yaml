apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      color: green
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        color: green
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "3.0.0"
        - name: DEPLOYMENT_COLOR
          value: "green"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
