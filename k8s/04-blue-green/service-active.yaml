apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-service
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
spec:
  type: NodePort
  selector:
    app: aceest-bluegreen
    color: green # Active color: point to green or blue
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30600
    name: http
