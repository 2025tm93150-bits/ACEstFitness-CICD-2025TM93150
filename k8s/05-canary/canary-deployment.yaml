apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-v3
  namespace: aceest-fitness
  labels:
    app: aceest-canary-demo
    track: canary
spec:
  replicas: 1 # 20% traffic weight in pod-ratio routing
  selector:
    matchLabels:
      app: aceest-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary-demo
        track: canary
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "3.0.0"
        - name: DEPLOY_ENV
          value: "canary"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
