apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest-fitness
  labels:
    app: aceest-canary-demo
spec:
  type: NodePort
  selector:
    app: aceest-canary-demo
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30700
    name: http
---
# Stable Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-stable-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-canary-service
            port:
              number: 5000
---
# Canary Ingress with 20% Weighted Split
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-canary-service
            port:
              number: 5000
