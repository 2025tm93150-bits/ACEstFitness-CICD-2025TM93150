apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest-fitness
  labels:
    app: aceest-canary-demo
    track: stable
spec:
  replicas: 4 # 80% traffic weight in pod-ratio routing
  selector:
    matchLabels:
      app: aceest-canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary-demo
        track: stable
        version: "2.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:2.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
        - name: DEPLOY_ENV
          value: "stable"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
