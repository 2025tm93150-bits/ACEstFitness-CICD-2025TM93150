apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-demo
    role: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow-demo
      role: primary
  template:
    metadata:
      labels:
        app: aceest-shadow-demo
        role: primary
        version: "2.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:2.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
        - name: DEPLOY_ENV
          value: "production-primary"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary-service
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-shadow-demo
    role: primary
  ports:
  - port: 5000
    targetPort: 5000
    name: http
