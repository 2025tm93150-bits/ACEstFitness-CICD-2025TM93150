apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-demo
    role: shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow-demo
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow-demo
        role: shadow
        version: "3.0.0-shadow"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "3.0.0"
        - name: DEPLOY_ENV
          value: "shadow-testing"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-shadow-demo
    role: shadow
  ports:
  - port: 5000
    targetPort: 5000
    name: http
---
# Traffic Mirroring Ingress Configuration (NGINX Mirroring)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-mirror-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # NGINX configuration snippet to duplicate/mirror incoming HTTP requests to shadow service
    nginx.ingress.kubernetes.io/configuration-snippet: |
      mirror /mirror;
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /mirror {
        internal;
        proxy_pass http://aceest-shadow-service.aceest-fitness.svc.cluster.local:5000$request_uri;
      }
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-primary-service
            port:
              number: 5000
