apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-experiment-a
  namespace: aceest-fitness
  labels:
    app: aceest-ab-testing
    cohort: control-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab-testing
      cohort: control-a
  template:
    metadata:
      labels:
        app: aceest-ab-testing
        cohort: control-a
        version: "2.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:2.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
        - name: DEPLOY_ENV
          value: "control-a"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-service-a
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-ab-testing
    cohort: control-a
  ports:
  - port: 5000
    targetPort: 5000
    name: http
