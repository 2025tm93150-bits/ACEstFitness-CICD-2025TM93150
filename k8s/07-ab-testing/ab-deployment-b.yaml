apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-experiment-b
  namespace: aceest-fitness
  labels:
    app: aceest-ab-testing
    cohort: treatment-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab-testing
      cohort: treatment-b
  template:
    metadata:
      labels:
        app: aceest-ab-testing
        cohort: treatment-b
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-app
        image: aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "3.0.0"
        - name: DEPLOY_ENV
          value: "treatment-b"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-service-b
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-ab-testing
    cohort: treatment-b
  ports:
  - port: 5000
    targetPort: 5000
    name: http
---
# Main Ingress for Cohort A (Default)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress-a
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-ab-service-a
            port:
              number: 5000
---
# Ingress routing Cohort B when header 'X-Experiment-Group: treatment' or cookie 'experiment=B' matches
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress-b
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Experiment-Group"
    nginx.ingress.kubernetes.io/canary-by-header-value: "treatment"
    nginx.ingress.kubernetes.io/canary-by-cookie: "experiment_group"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-ab-service-b
            port:
              number: 5000
