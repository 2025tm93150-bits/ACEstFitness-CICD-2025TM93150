# SonarQube Project Configuration for ACEest Fitness & Gym
sonar.projectKey=aceest-fitness-app
sonar.projectName=ACEest Fitness & Gym DevOps CI/CD
sonar.projectVersion=3.0.0

# Source & Test Code Directories
sonar.sources=.
sonar.inclusions=ACEest_Fitness.py,ACEest_Fitness_v1.0.py,ACEest_Fitness_v1.1.py,ACEest_Fitness_v2.0.py
sonar.exclusions=**/tests/**,**/.venv/**,**/reports/**,**/htmlcov/**,**/__pycache__/**

sonar.tests=tests
sonar.test.inclusions=tests/test_*.py

# Test Execution & Coverage Reports
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/test-results.xml

# Code Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate Settings
sonar.qualitygate.wait=true
